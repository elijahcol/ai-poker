name: Build Poker Lab EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pyinstaller
      - run: pyinstaller --onefile --windowed --name PokerLab poker_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: PokerLab-Windows
          path: dist/PokerLab.exe
